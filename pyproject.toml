# AI install hint: choose deps by OS/env + needed ui/bot. do NOT install all.
# minimal core first; missing packages can be installed on demand.

[project]
name = "genericagent"
version = "0.1.0"
description = "Minimalist self-evolving autonomous agent framework"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    "bottle>=0.12",
    "simple-websocket-server>=0.4",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
# select extras, not all. match current task/env.
# examples: .[ui] for GUI, bot deps only if bot needed.
ui = [
    "streamlit>=1.28",
    "pywebview>=4.0",
    "textual>=0.70",
]
all-frontends = [
    "python-telegram-bot>=20.0",
    "qq-botpy>=1.0",
    "pycryptodome>=3.19",
    "qrcode>=7.4",
    "lark-oapi>=1.0",
    "wecom-aibot-sdk>=1.0",
    "dingtalk-stream>=0.20",
]
vision = [
    "Pillow>=10.0",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "ultralytics>=8.0",
    "rapidocr-onnxruntime>=1.3",
]
web = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "starlette>=0.27",
]
automation = [
    "playwright>=1.40",
    "playwright-stealth>=1.0",
    "pywin32>=306",
    "uiautomator2>=3.0",
]
tools = [
    "langfuse>=2.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "markdown>=3.5",
    "psutil>=5.9",
    "urllib3>=2.0",
    "PySide6>=6.5",
    "discord>=2.0",
    "yara-python>=4.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
packages = ["ga_cli"]

[project.scripts]
ga = "ga_cli.cli:main"